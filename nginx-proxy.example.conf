# 企业微信 API 反代（用于绕过「企业可信 IP」白名单）
# 部署在固定 IP 的服务器上（该 IP 加入企业微信 → 自建应用 → 企业可信 IP 白名单）。
# Worker 把 qyapi.weixin.qq.com 的请求改发到本反代域名，由本服务器转发到企微。
#
# 用法：
#   1. 复制本文件为 /etc/nginx/conf.d/wecom-proxy.conf，按需修改 server_name / 证书路径 / token
#   2. 将反代域名（如 proxy.yourdomain.com）解析到本服务器
#   3. nginx -t && systemctl reload nginx
#   4. 在 Cloudflare 后台「变量和密钥 / vars」把 PROXY_URL 设为 https://proxy.yourdomain.com
#      （PROXY_TOKEN 与下方 token 保持一致，作为反代鉴权，防止被他人滥用）
#   5. 将本服务器公网 IP 加入企业微信「企业可信 IP」

server {
    listen 443 ssl http2;
    server_name proxy.yourdomain.com;   # 改成你的反代域名

    ssl_certificate     /etc/ssl/yourdomain/fullchain.pem;
    ssl_certificate_key /etc/ssl/yourdomain/privkey.pem;

    # 仅允许企业微信 API 路径，拒绝其它，避免成为开放代理
    location ~ ^/cgi-bin/ {
        # 反代鉴权：Worker 会带 X-WeCom-Proxy-Token 头，不一致则拒绝
        if ($http_x_wecom_proxy_token != "REPLACE_WITH_YOUR_PROXY_TOKEN") {
            return 403;
        }

        proxy_pass https://qyapi.weixin.qq.com;
        proxy_ssl_server_name on;          # 必须：TLS SNI 指向 qyapi
        proxy_ssl_verify on;

        proxy_set_header Host qyapi.weixin.qq.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 透传请求体/响应，适配企微的 POST + 流式
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 30s;
    }

    # 其它路径一律拒绝
    location / {
        return 404;
    }
}

name = "wecom-relay"
main = "src/worker.js"
compatibility_date = "2025-04-01"

# 静态资源：公开首页 / 管理后台 / 教程图
# 仅 index.html、admin.html、assets/ 会上传；其余（node_modules、src、*.js 等）被 .assetsignore 排除
[assets]
directory = "."
binding = "ASSETS"
not_found_handling = "none"

# 持久化状态（token 缓存 / 登录态 / 二维码状态 / 限流 / 待确认变更）
# 命名空间已创建于 Cloudflare 控制台（绑定名 WECOM_RELAY_KV）
[[kv_namespaces]]
binding = "WECOM_RELAY_KV"
id = "8375939009bd4b49ba7a165f0c7f4f31"

# 每 6 小时触发一次，用于在企业微信二维码过期前自动刷新
[crons]
crons = ["0 */6 * * *"]

# 非敏感配置（会写入 wrangler.toml，可见）
[vars]
WECOM_CORP_ID = "ww059a8dadfd559537"
WECOM_AGENT_ID = "1000004"
WECOM_QR_ADMIN_USERID = "zhengfei"

# 敏感配置请用 secret（不写入文件）：
#   npx wrangler secret put WECOM_SECRET
#   npx wrangler secret put WECOM_CONTACTS_SECRET
#   npx wrangler secret put WECOM_CALLBACK_TOKEN
#   npx wrangler secret put WECOM_CALLBACK_AES_KEY
#   npx wrangler secret put ADMIN_PASSWORD
